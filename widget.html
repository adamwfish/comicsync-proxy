<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RoboPictoComics Widget</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
      min-height: 100vh;
    }

    .widget {
      max-width: 380px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 600px;
    }

    .widget-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      align-items: center;
      text-align: center;
    }

    .header-item {
      font-size: 12px;
      opacity: 0.9;
    }

    .header-item .label {
      font-size: 10px;
      opacity: 0.8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .header-item .value {
      font-size: 18px;
      font-weight: bold;
      margin-top: 4px;
    }

    .header-item.date .value {
      font-size: 14px;
    }

    .header-item.weather .value {
      font-size: 14px;
    }

    .widget-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }

    .section {
      margin-bottom: 20px;
      flex-shrink: 0;
    }

    .section-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #667eea;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .blog-post {
      background: #f8f9fa;
      padding: 12px;
      border-radius: 8px;
      border-left: 3px solid #667eea;
    }

    .blog-title {
      font-size: 13px;
      font-weight: 600;
      color: #222;
      margin-bottom: 6px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .blog-link {
      font-size: 11px;
      color: #667eea;
      text-decoration: none;
      font-weight: 500;
      display: inline-block;
      margin-top: 6px;
    }

    .blog-link:hover {
      text-decoration: underline;
    }

    .fun-facts-container {
      flex: 1;
      overflow-y: auto;
      padding-right: 8px;
    }

    .fun-fact {
      background: #f8f9fa;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 10px;
      font-size: 12px;
      line-height: 1.6;
      color: #333;
      border-left: 3px solid #764ba2;
      flex-shrink: 0;
    }

    .fun-fact:last-child {
      margin-bottom: 0;
    }

    .load-more {
      text-align: center;
      padding: 12px;
      margin-top: 10px;
    }

    .load-more-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .load-more-btn:hover {
      transform: scale(1.05);
    }

    .load-more-btn:active {
      transform: scale(0.95);
    }

    .loading {
      text-align: center;
      padding: 12px;
      font-size: 11px;
      color: #999;
    }

    .error {
      background: #fff3cd;
      border: 1px solid #ffc107;
      color: #856404;
      padding: 10px;
      border-radius: 6px;
      font-size: 11px;
      margin-bottom: 12px;
    }

    /* Scrollbar styling */
    .fun-facts-container::-webkit-scrollbar {
      width: 4px;
    }

    .fun-facts-container::-webkit-scrollbar-track {
      background: transparent;
    }

    .fun-facts-container::-webkit-scrollbar-thumb {
      background: #ddd;
      border-radius: 2px;
    }

    .fun-facts-container::-webkit-scrollbar-thumb:hover {
      background: #ccc;
    }

    .emoji {
      margin-right: 4px;
    }
  </style>
</head>
<body>
  <div class="widget">
    <!-- Header: Date, Weather, Temperature -->
    <div class="widget-header">
      <div class="header-item date">
        <div class="label">Today</div>
        <div class="value" id="todayDate">--</div>
      </div>
      <div class="header-item weather">
        <div class="label" id="weatherLabel">--</div>
        <div class="value" id="weatherTemp">--°</div>
      </div>
      <div class="header-item">
        <div class="label">Condition</div>
        <div class="value" id="weatherCondition">--</div>
      </div>
    </div>

    <!-- Content: Blog + Fun Facts -->
    <div class="widget-content">
      <!-- Latest Blog Post -->
      <div class="section">
        <div class="section-title">📰 Latest Post</div>
        <div id="blogContainer" class="blog-post">
          <div class="loading">Loading...</div>
        </div>
      </div>

      <!-- Comic Book Fun Facts -->
      <div class="section" style="flex: 1; display: flex; flex-direction: column;">
        <div class="section-title">⭐ Comic Book Fun Facts</div>
        <div class="fun-facts-container" id="factsContainer">
          <div class="loading">Loading fun facts...</div>
        </div>
        <div class="load-more">
          <button class="load-more-btn" id="loadMoreBtn">Load More Facts</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const WIDGET_API = '/widget'; // Adjust if hosted separately

    let currentFactPage = 0;

    // ─── Format Date ─────────────────────────────────────────────────────
    function formatDate(date) {
      const options = { month: 'short', day: 'numeric', year: 'numeric' };
      return date.toLocaleDateString('en-US', options);
    }

    // ─── Fetch and Display Today's Date ──────────────────────────────────
    function updateDate() {
      const today = new Date();
      document.getElementById('todayDate').textContent = formatDate(today);
    }

    // ─── Fetch and Display Weather ──────────────────────────────────────
    async function fetchWeather() {
      try {
        // Try to get user's location, fallback to NYC
        let lat = '40.7128';
        let lon = '-74.0060';

        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            (position) => {
              lat = position.coords.latitude;
              lon = position.coords.longitude;
              loadWeatherData(lat, lon);
            },
            () => loadWeatherData(lat, lon) // Fallback if geolocation fails
          );
        } else {
          loadWeatherData(lat, lon);
        }
      } catch (e) {
        console.error('Weather fetch error:', e);
      }
    }

    async function loadWeatherData(lat, lon) {
      try {
        const response = await fetch(`${WIDGET_API}/weather?lat=${lat}&lon=${lon}`);
        const data = await response.json();

        if (data.success) {
          document.getElementById('weatherTemp').textContent = `${data.temp}°`;
          document.getElementById('weatherCondition').textContent = data.condition;
          document.getElementById('weatherLabel').textContent = data.isDaytime ? '☀️' : '🌙';
        }
      } catch (e) {
        console.error('Weather error:', e);
      }
    }

    // ─── Fetch and Display Latest Blog Post ──────────────────────────────
    async function fetchBlog() {
      try {
        const response = await fetch(`${WIDGET_API}/blog-latest`);
        const data = await response.json();

        let html = '';
        if (data.success && data.title) {
          html = `
            <div class="blog-title">${data.title}</div>
            <a href="${data.url}" target="_blank" rel="noopener noreferrer" class="blog-link">Read →</a>
          `;
        } else {
          html = '<div style="color: #999; font-size: 12px;">No posts available</div>';
        }

        document.getElementById('blogContainer').innerHTML = html;
      } catch (e) {
        console.error('Blog fetch error:', e);
        document.getElementById('blogContainer').innerHTML =
          '<div style="color: #999; font-size: 12px;">Failed to load blog</div>';
      }
    }

    // ─── Fetch and Display Fun Facts ────────────────────────────────────
    async function fetchFunFacts(page = 0) {
      try {
        const response = await fetch(`${WIDGET_API}/fun-facts?page=${page}`);
        const data = await response.json();

        if (data.success && data.facts && data.facts.length > 0) {
          const container = document.getElementById('factsContainer');
          const html = data.facts
            .map((fact) => `<div class="fun-fact">${fact}</div>`)
            .join('');

          if (page === 0) {
            container.innerHTML = html;
          } else {
            container.innerHTML += html;
          }

          currentFactPage = page + 1;
        }
      } catch (e) {
        console.error('Fun facts fetch error:', e);
        if (currentFactPage === 0) {
          document.getElementById('factsContainer').innerHTML =
            '<div style="color: #999; font-size: 12px;">Failed to load facts</div>';
        }
      }
    }

    // ─── Load More Button Handler ───────────────────────────────────────
    document.getElementById('loadMoreBtn').addEventListener('click', () => {
      fetchFunFacts(currentFactPage);
    });

    // ─── Initialize ─────────────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', () => {
      updateDate();
      fetchWeather();
      fetchBlog();
      fetchFunFacts(0);

      // Refresh blog and weather every hour
      setInterval(fetchBlog, 60 * 60 * 1000);
      setInterval(fetchWeather, 60 * 60 * 1000);
    });
  </script>
</body>
</html>
