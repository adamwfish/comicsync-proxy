<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RoboPictoComics Widget</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .widget {
      background: white;
      border-bottom: 2px solid #667eea;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 30px;
      min-height: 60px;
    }

    .date-section {
      flex-shrink: 0;
      font-size: 13px;
      font-weight: 600;
      color: #667eea;
    }

    .date-label {
      font-size: 11px;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .date-value {
      font-size: 14px;
      color: #222;
      font-weight: 700;
    }

    .blog-section {
      flex: 1;
      min-width: 0;
    }

    .blog-label {
      font-size: 11px;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .blog-title {
      font-size: 14px;
      font-weight: 600;
      color: #222;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .blog-title a {
      color: #222;
      text-decoration: none;
    }

    .blog-title a:hover {
      color: #667eea;
    }

    .loading {
      font-size: 12px;
      color: #ccc;
    }

    .error {
      font-size: 12px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="widget">
    <div class="date-section">
      <div class="date-label">Today</div>
      <div class="date-value" id="todayDate">--</div>
    </div>

    <div class="blog-section">
      <div class="blog-label">📰 on the blog today</div>
      <div class="blog-title" id="blogTitle" class="loading">Loading...</div>
    </div>
  </div>

  <script>
    // Format date
    function formatDate(date) {
      const options = { month: 'short', day: 'numeric' };
      return date.toLocaleDateString('en-US', options);
    }

    // Update date
    function updateDate() {
      document.getElementById('todayDate').textContent = formatDate(new Date());
    }

    // Fetch blog post
    async function fetchBlog() {
      try {
        // Try robopictocomics blog feed
        const response = await fetch('https://www.robopictocomics.com/the-picto-daily-digest?format=json');
        if (!response.ok) throw new Error('Feed unavailable');

        const data = await response.json();

        // Handle different feed formats
        let latestPost = null;
        if (data.items?.[0]) {
          latestPost = data.items[0];
        } else if (data.feed?.entry?.[0]) {
          latestPost = data.feed.entry[0];
        } else if (Array.isArray(data) && data[0]) {
          latestPost = data[0];
        }

        if (latestPost) {
          const titleEl = document.getElementById('blogTitle');
          titleEl.className = 'blog-title';
          const url = latestPost.url || latestPost.link || 'https://www.robopictocomics.com/the-picto-daily-digest';
          const title = latestPost.title || latestPost.name || 'Latest Post';
          titleEl.innerHTML = `<a href="${url}" target="_blank">${title}</a>`;
        } else {
          throw new Error('No posts found');
        }
      } catch (e) {
        console.error('Blog error:', e);
        document.getElementById('blogTitle').className = 'error';
        document.getElementById('blogTitle').textContent = 'Check back soon';
      }
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      updateDate();
      fetchBlog();

      // Refresh every hour
      setInterval(fetchBlog, 60 * 60 * 1000);
    });
  </script>
</body>
</html>
