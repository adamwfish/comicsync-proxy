<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RoboPictoComics Widget</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .widget {
      background: white;
      border-bottom: 2px solid #667eea;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 30px;
      min-height: 60px;
    }

    .date-section {
      flex-shrink: 0;
      font-size: 13px;
      font-weight: 600;
      color: #667eea;
    }

    .date-label {
      font-size: 11px;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .date-value {
      font-size: 14px;
      color: #222;
      font-weight: 700;
    }

    .blog-section {
      flex: 1;
      min-width: 0;
    }

    .blog-label {
      font-size: 11px;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .blog-title {
      font-size: 14px;
      font-weight: 600;
      color: #222;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .blog-title a {
      color: #222;
      text-decoration: none;
    }

    .blog-title a:hover {
      color: #667eea;
    }

    .loading {
      font-size: 12px;
      color: #ccc;
    }

    .error {
      font-size: 12px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="widget">
    <div class="date-section">
      <div class="date-label">Today</div>
      <div class="date-value" id="todayDate">--</div>
    </div>

    <div class="blog-section">
      <div class="blog-label">📰 on the blog today</div>
      <div class="blog-title" id="blogTitle" class="loading">Loading...</div>
    </div>
  </div>

  <script>
    // Format date
    function formatDate(date) {
      const options = { month: 'short', day: 'numeric' };
      return date.toLocaleDateString('en-US', options);
    }

    // Update date
    function updateDate() {
      document.getElementById('todayDate').textContent = formatDate(new Date());
    }

    // Fetch blog post from HTML
    async function fetchBlog() {
      try {
        const response = await fetch('https://www.robopictocomics.com/the-picto-daily-digest');
        if (!response.ok) throw new Error('Page unavailable');

        const html = await response.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');

        // Look for post titles - try common selectors
        let title = null;
        let link = 'https://www.robopictocomics.com/the-picto-daily-digest';

        // Try different selectors for blog post titles
        const selectors = [
          '.blog-item h2 a',
          '.post-title a',
          'article h2 a',
          '.entry-title a',
          'h2.post-title',
          '.blog-title a',
          '[class*="post"] h2 a',
          'h2[class*="title"]',
          'h2:first-of-type'
        ];

        for (const selector of selectors) {
          const element = doc.querySelector(selector);
          if (element && element.textContent.trim()) {
            title = element.textContent.trim();
            link = element.href || link;
            break;
          }
        }

        if (title) {
          const titleEl = document.getElementById('blogTitle');
          titleEl.className = 'blog-title';
          titleEl.innerHTML = `<a href="${link}" target="_blank">${title}</a>`;
        } else {
          throw new Error('No post title found');
        }
      } catch (e) {
        console.error('Blog error:', e);
        document.getElementById('blogTitle').className = 'error';
        document.getElementById('blogTitle').textContent = 'Check back soon';
      }
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      updateDate();
      fetchBlog();

      // Refresh every hour
      setInterval(fetchBlog, 60 * 60 * 1000);
    });
  </script>
</body>
</html>
